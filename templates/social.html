<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The 1200×630 social preview. build.py screenshots this with Chrome. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Manrope:wght@600..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            position: relative;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a1a;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
        }

        .blob-top {
            width: 440px;
            height: 440px;
            right: -140px;
            top: -150px;
            background: #f3effd;
        }

        .blob-bottom {
            width: 380px;
            height: 380px;
            left: -170px;
            bottom: -210px;
            background: #f6f4fe;
        }

        .card {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            padding: 0 72px;
        }

        .name {
            font-family: 'Manrope', sans-serif;
            font-size: 76px;
            font-weight: 700;
            line-height: 1.05;
        }

        .title {
            font-family: 'Manrope', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #6B46C1;
            margin-top: 18px;
            white-space: nowrap;
        }

        .headline {
            font-size: 28px;
            line-height: 1.45;
            color: #404040;
            margin-top: 28px;
            text-wrap: balance;
        }

        .photo {
            flex: none;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #ffffff;
            box-shadow: 0 25px 50px rgba(139, 92, 246, 0.18);
        }

        .domain {
            position: absolute;
            right: 48px;
            bottom: 36px;
            font-size: 20px;
            font-weight: 600;
            color: #6B46C1;
        }
    </style>
</head>
<body>
    <div class="blob blob-top"></div>
    <div class="blob blob-bottom"></div>
    <div class="card">
        <div>
            <div class="name">$name</div>
            <div class="title">$title</div>
            <div class="headline">$headline</div>
        </div>
        <img class="photo" src="$photo" alt="">
    </div>
    <div class="domain">$domain</div>
</body>
</html>
