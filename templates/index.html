<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$page_title</title>
    <meta name="description" content="$description">
    <meta name="author" content="$name">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="$page_title">
    <meta property="og:description" content="$description">
    <meta property="og:url" content="$url">
    <meta property="og:image" content="$url/img/social-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:site_name" content="$name">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$page_title">
    <meta name="twitter:description" content="$description">
    <meta name="twitter:image" content="$url/img/social-preview.png">

    <!-- Canonical URL and machine-readable versions -->
    <link rel="canonical" href="$url">
    <link rel="alternate" type="text/markdown" href="cv.md">

    <!-- Structured Data for AI/Search -->
    <script type="application/ld+json">
$jsonld
    </script>

    <!-- Favicons -->
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="img/favicon-96x96.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-touch-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="img/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="img/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-touch-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="img/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-touch-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-180x180.png">

    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="img/android-chrome-512x512.png">

    <!-- Web App Manifest -->
    <meta name="msapplication-TileColor" content="#6B46C1">
    <meta name="theme-color" content="#6B46C1">

    <!-- Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Manrope:wght@600..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/modern-style.css">
</head>
<body>
    <!-- Generated from cv.yml by build.py. Edit cv.yml, not this file. -->

    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
$nav
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main" id="main">
        <!-- Hero Section -->
        <section class="hero" id="about">
            <div class="container">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1 class="hero-title">$name</h1>
                        <p class="hero-subtitle">$title</p>
                        <p class="hero-contact">$contact_line</p>
                        <p class="hero-description">
                            $summary
                        </p>
                        <div class="hero-actions">
                            <a href="$pdf" class="btn btn-primary" download>
                                Download PDF
                            </a>
                            <a href="#contact" class="btn btn-secondary">
                                Get in touch
                            </a>
                        </div>
                    </div>
                    <div class="hero-image">
                        <img src="$photo" alt="$name" class="profile-image" width="280" height="280">
                    </div>
                </div>
            </div>
        </section>

        <!-- Experience Section -->
        <section class="experience" id="experience">
            <div class="container">
                <h2 class="section-title">Experience</h2>
                <div class="timeline">
$experience
                </div>
            </div>
        </section>
$work
        <!-- Skills Section -->
        <section class="skills" id="skills">
            <div class="container">
                <h2 class="section-title">Skills</h2>
                <div class="skills-grid">
$skills
                </div>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="contact" id="contact">
            <div class="container">
                <h2 class="section-title">Contact</h2>
                <div class="contact-content">
                    <div class="contact-info">
$contact
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">$footer</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/modern-script.js"></script>
</body>
</html>
