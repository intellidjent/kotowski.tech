# Fails a push or PR when index.html, cv.md, llms.txt or sitemap.xml no
# longer match cv.yml. The PDF is built locally (python3 build.py) because
# Chrome output isn't byte-stable, so it can't be compared here.
name: Check generated files

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py --check
